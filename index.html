<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeOS</title></head><body><script>window.LIFEOS_PAYLOAD="";</script><script src="./v08-payload-01.js"></script><script src="./v08-payload-02.js"></script><script src="./v08-payload-03.js"></script><script>(async()=>{try{const b=Uint8Array.from(atob(window.LIFEOS_PAYLOAD),c=>c.charCodeAt(0));const h=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px;font-family:monospace">LifeOS failed to start: '+String(e)+'</pre>';console.error(e)}})()</script></body></html>
